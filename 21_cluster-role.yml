# Create a ServiceAccount for the dashboard admin user
kind: ServiceAccount
apiVersion: v1
metadata:
  name: admin-user
  namespace: kubernetes-dashboard

---

# kubernetes-dashboard automatically creates a ClusterRole named "cluster-admin"
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: admin-user-binding
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: kubernetes-dashboard
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

# To access the dashboard, we need to create a token for the admin-user ServiceAccount
# kubectl -n kubernetes-dashboard create token admin-user

# Expose the dashboard
# kubectl proxy

# Access the dashboard at:
# http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy/

# we're accessing this dashboard as an admin user using the token created above