kind: Deployment
apiVersion: apps/v1
metadata:
  name: apache-deployment
  namespace: apache
spec:
  replicas: 1
  selector: # defines the pods to be selected
    matchLabels:
      app: apache
  # Pod template: same as pod.yaml
  template:
    metadata:
      name: apache-dep-pod
      labels:
        app: apache
    spec:
      containers:
      - name: apache
        image: httpd:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m" # minimum cpu required 0.1 cpu core
            memory: "128Mi" # minimum memory required
          limits:
            cpu: "200m" # maximum cpu allowed 0.2 cpu cores
            memory: "256Mi" # maximum memory allowed