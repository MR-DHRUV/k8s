  kind: DaemonSet
  apiVersion: apps/v1
  metadata:
    name: nginx-daemonset
    namespace: nginx
  spec:
    selector: # defines the pods to be selected
      matchLabels:
        app: nginx
    # Pod template: same as pod.yaml
    template:
      metadata:
        name: nginx-dmn-pod
        labels:
          app: nginx
      spec:
        containers:
        - name: nginx
          image: nginx:latest
          ports:
          - containerPort: 80

